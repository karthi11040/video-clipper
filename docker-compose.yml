services:
  clipforge:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATA_DIR: /app/data
      MAX_UPLOAD_BYTES: "3221225472"  # 3 GiB
      MAX_DURATION_SECONDS: "10800"   # 3 hours
      CHUNK_BYTES: "8388608"           # 8 MiB upload chunks
      UPLOAD_TTL_SECONDS: "86400"      # 24 hours
      JOB_TTL_SECONDS: "21600"         # 6 hours
      FFMPEG_PRESET: veryfast
      FFMPEG_CRF: "23"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
